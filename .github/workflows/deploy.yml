name: Deploy Backend to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Load NVM (Node Version Manager) environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Navigate to the server folder
            cd ~/Ikigai-main/server

            # Pull latest code and force-align with GitHub
            git fetch --all
            git reset --hard origin/main

            # Install dependencies
            npm install

            # Restart the backend with legacy OpenSSL support for compatibility
            NODE_OPTIONS=--openssl-legacy-provider pm2 restart ikigai-backend || NODE_OPTIONS=--openssl-legacy-provider pm2 start server.js --name "ikigai-backend"
            
            # Save the PM2 list so it persists after server restarts
            pm2 save